BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tr-traffic-ai"
BBFILE_PATTERN_meta-tr-traffic-ai = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tr-traffic-ai = "7"

# Adjust this list to the actual Yocto release used by the build.
LAYERSERIES_COMPAT_meta-tr-traffic-ai = "scarthgap styhead walnascar"
