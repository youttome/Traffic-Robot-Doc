BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tr"
BBFILE_PATTERN_meta-tr = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tr = "7"

# Adjust this list to the actual Yocto release used by the build.
LAYERSERIES_COMPAT_meta-tr = "scarthgap styhead walnascar"
